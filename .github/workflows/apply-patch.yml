name: Apply Patch File

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Apply patch
      run: |
        if [ ! -f "patch.patch" ]; then
          echo "patch.patch file not found!"
          exit 1
        fi

        if git apply --check --reverse patch.patch >/dev/null 2>&1; then
          echo "patch.patch is already applied, nothing to do."
        elif git apply --check patch.patch >/dev/null 2>&1; then
          git apply patch.patch
          echo "Applied patch.patch."
        elif git apply --3way patch.patch; then
          echo "Applied patch.patch with 3-way merge."
        else
          echo "patch.patch does not apply cleanly and is not already applied."
          git apply --check -v patch.patch || true
          exit 1
        fi

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add .

        if ! git diff --cached --quiet; then
          git commit -m "chore: automatically applied patch"
          git push
        else
          echo "No changes to commit (patch already applied)."
        fi
